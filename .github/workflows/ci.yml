name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      autotests_full:
        description: Run all 55 original console tests in parallel shards
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check toolchain
        run: |
          cmake --version
          ninja --version
          c++ --version
          python3 --version

      - name: Install Python LLVM binding
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install llvmlite

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"

      - name: Build
        run: cmake --build build --parallel 2

      # Include the complete source tree: run_game.py fingerprints guest
      # translation inputs from src/{ee,elf,lift,llvm,tools}, not just
      # the runtime used to link the translated host objects.
      - name: Upload real-game validation tools
        uses: actions/upload-artifact@v4
        with:
          name: ee-recomp-linux
          path: |
            build/ee_recomp
            build/ee_game_runner
            tools/run_game.py
            tools/verify_ir.py
            tools/link_native_objects.py
            include/
            src/
          if-no-files-found: error
          retention-days: 1

      # Tar preserves executable bits and symlinks lost by raw artifact
      # uploads. Integration tests need object files, libraries and the
      # configured CTest metadata, not just the runner executables.
      - name: Package CTest build and Python environment
        run: tar -czf "$RUNNER_TEMP/ee-ctest-build.tar.gz" build .venv

      - name: Upload CTest build
        uses: actions/upload-artifact@v4
        with:
          name: ee-ctest-build
          path: ${{ runner.temp }}/ee-ctest-build.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  tests:
    name: "CTest (${{ matrix.shard }})"
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [game-0, game-1, game-2, game-3, fast-0, fast-1, fast-2]
    steps:
      - uses: actions/checkout@v4

      - name: Download configured CTest build
        uses: actions/download-artifact@v4
        with:
          name: ee-ctest-build
          path: .

      - name: Restore build and Python environment
        run: tar -xzf ee-ctest-build.tar.gz

      - name: Run CTest shard
        run: python3 tools/ci/ctest_shard.py --build-dir build --shard "${{ matrix.shard }}"

      - name: Upload CTest failure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "ee-ctest-${{ matrix.shard }}"
          path: |
            build/Testing/ctest-${{ matrix.shard }}.xml
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 7

  autotests-pilot:
    name: "Original ps2autotests (${{ matrix.group }}; observational)"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.autotests_full && '[{"group":"ee","patterns":"cpu/ee/* cpu/ee_cop0/*"},{"group":"fpu","patterns":"cpu/ee_fpu/*"},{"group":"simd","patterns":"cpu/ee_simd/*"},{"group":"dma","patterns":"dma/*"},{"group":"kernel","patterns":"kernel/* gs/* memory/*"},{"group":"vu","patterns":"cpu/vu0_macro/* vu/*"}]' || '[{"group":"ee","patterns":"cpu/ee/alu cpu/ee/muldiv cpu/ee_fpu/fcr cpu/ee_simd/funnel cpu/ee_simd/shuffle dma/dmac/cpcond cpu/ee_cop0/performance"},{"group":"vu","patterns":"cpu/vu0_macro/transfer vu/lower/integer vu/lower/efu"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ee-ctest-build
          path: .
      - name: Restore build and Python environment
        run: tar -xzf ee-ctest-build.tar.gz
      - name: Compare original console transcripts
        run: |
          read -r -a patterns <<< "$AUTOTEST_PATTERNS"
          .venv/bin/python tools/run_ps2autotests.py "${patterns[@]}" \
            --jobs 2 --emit-jobs 1 --report-only --build-dir build
        env:
          AUTOTEST_PATTERNS: ${{ matrix.patterns }}
      - name: Upload pilot transcripts and stop reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps2autotests-${{ matrix.group }}
          path: build/autotests/runs/
          if-no-files-found: warn
          retention-days: 7
