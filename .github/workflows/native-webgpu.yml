name: Native WebGPU build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  native-webgpu-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned native WebGPU SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/_deps/wgpu-native
          curl --fail --location --retry 3 https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.1.1/wgpu-linux-x86_64-release.zip -o "$RUNNER_TEMP/wgpu-native.zip"
          echo "95a4d90c071005a98d03eab348beaa6b07e16eb00d1dcdb9f8348f75eb97ec5a  $RUNNER_TEMP/wgpu-native.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/wgpu-native.zip" -d build/_deps/wgpu-native
      - name: Configure native-only WebGPU
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DEE_ENABLE_WEBGPU=ON
      - name: Assert native SDK lives under build/_deps
        run: |
          test -f build/_deps/wgpu-native/include/webgpu/webgpu.h
          test -f build/_deps/wgpu-native/include/webgpu/wgpu.h
          test -f build/_deps/wgpu-native/lib/libwgpu_native.a -o -f build/_deps/wgpu-native/lib/libwgpu_native.so -o -f build/_deps/wgpu-native/lib/libwgpu_native.so.0
      - name: Ensure software Vulkan adapter (reuse preinstalled Lavapipe)
        shell: bash
        run: |
          set -euo pipefail
          has_vulkan() {
            ldconfig -p | grep -q 'libvulkan.so.1' &&
              find /usr/share/vulkan/icd.d -name '*lvp*.json' -print -quit | grep -q .
          }
          if has_vulkan; then
            echo 'Using preinstalled Vulkan loader and Mesa Lavapipe ICD'
            exit 0
          fi
          echo 'Missing Vulkan loader or Lavapipe; installing from cached package indexes'
          if ! sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1
          fi
          if ! has_vulkan; then
            echo 'Vulkan unavailable after cached install; refreshing package indexes'
            sudo apt-get update -qq
            sudo apt-get install -y -qq --reinstall mesa-vulkan-drivers libvulkan1
          fi
          has_vulkan || { echo 'Lavapipe or Vulkan loader still missing' >&2; exit 1; }
      - name: Compile native WebGPU renderer and smoke test
        run: cmake --build build --target ee_game_runner ee_webgpu_native_smoke --parallel 2
      - name: Run real native WebGPU compute readback
        shell: bash
        run: |
          set -euo pipefail
          icd=$(find /usr/share/vulkan/icd.d -name '*lvp*.json' -print -quit)
          if [ -z "$icd" ]; then
            echo "Mesa lavapipe Vulkan ICD is unavailable" >&2
            exit 1
          fi
          export VK_ICD_FILENAMES="$icd"
          export EE_WEBGPU_REQUIRE_ADAPTER=1
          ctest --test-dir build -R ee_webgpu_native_smoke --output-on-failure

  native-webgpu-windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # CMake configures the pinned SDK into build/_deps/wgpu-native.
      # Deliberately exercise the same automatic provisioning as users.
      - name: Activate installed MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure native MSVC WebGPU and raylib surface
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DEE_MSVC_WARNINGS_AS_ERRORS=ON -DEE_ENABLE_WEBGPU=ON -DEE_ENABLE_RAYLIB_WINDOW=ON
      - name: Assert native SDK lives under build/_deps
        shell: pwsh
        run: |
          $root = 'build/_deps/wgpu-native'
          foreach ($file in @('include/webgpu/webgpu.h', 'include/webgpu/wgpu.h', 'lib/wgpu_native.lib')) {
            if (!(Test-Path (Join-Path $root $file))) {
              throw "Missing build/_deps WebGPU dependency: $file"
            }
          }
          if (!(Test-Path (Join-Path $root 'lib/wgpu_native.dll')) -and
              !(Test-Path (Join-Path $root 'bin/wgpu_native.dll'))) {
            throw 'Missing build/_deps WebGPU runtime DLL'
          }
      - name: Assert raylib was fetched under build/_deps
        shell: pwsh
        run: |
          if (!(Test-Path 'build/_deps/raylib-src/src/raylib.h')) {
            throw 'Missing build/_deps/raylib-src dependency'
          }
      - name: Compile native game runner with MSVC warnings as errors
        shell: pwsh
        run: cmake --build build --config Release --target ee_game_runner --parallel 2 -- -k 0


  native-webgpu-windows-clang:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate installed MSVC toolchain for Clang STL and dumpbin
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # The GitHub image can have LLVM 20 under Program Files while
      # VS 2026's MSVC STL requires Clang 22 or newer (STL1000).
      # Pin the compiler instead of suppressing the version check.
      - name: Install pinned Windows Clang 22 for the VS 2026 STL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '22.1.8'
          $expectedSha256 = '16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c'
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-$version-win64.exe"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/LLVM-$version-win64.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer -MaximumRetryCount 3 -RetryIntervalSec 5
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -Path $installer).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "LLVM installer checksum mismatch: $actualSha256"
          }
          $root = Join-Path $env:RUNNER_TEMP 'llvm-22'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$root") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "LLVM 22 installer returned $($process.ExitCode)"
          }
          $clangxx = Join-Path $root 'bin/clang++.exe'
          if (!(Test-Path $clangxx)) {
            throw "Pinned Clang 22 missing: $clangxx"
          }
          & $clangxx --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Keep the explicit clang++/lld-link developer configuration
      # covered alongside MSVC; the pinned native WebGPU SDK needs
      # its existing Windows system-library link configuration.
      - name: Configure clang++ and lld-link with raylib from a clean tree
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'llvm-22'
          $clang = Join-Path $root 'bin/clang.exe'
          $clangxx = Join-Path $root 'bin/clang++.exe'
          if (!(Test-Path $clang) -or !(Test-Path $clangxx)) {
            throw 'Pinned LLVM 22 clang/clang++ installation missing'
          }
          cmake -S . -B build-clang -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_C_COMPILER=$clang" `
            "-DCMAKE_CXX_COMPILER=$clangxx" `
            -DEE_CLANG_WARNINGS_AS_ERRORS=ON `
            -DEE_ENABLE_WEBGPU=ON `
            -DEE_ENABLE_RAYLIB_WINDOW=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assert fresh clang dependencies under build/_deps
        shell: pwsh
        run: |
          foreach ($file in @('include/webgpu/webgpu.h', 'include/webgpu/wgpu.h', 'lib/wgpu_native.lib')) {
            if (!(Test-Path (Join-Path 'build-clang/_deps/wgpu-native' $file))) {
              throw "Missing clean Clang WebGPU SDK: $file"
            }
          }
          if (!(Test-Path 'build-clang/_deps/raylib-src/src/raylib.h')) {
            throw 'Missing clean Clang raylib dependency'
          }
      - name: Compile native game runner and VU1 AOT fixtures with Clang warnings as errors
        shell: pwsh
        run: cmake --build build-clang --config Release --target ee_game_runner ee_vu1_aot_fixture vu1_recomp --parallel 2 -- -k 0
      - name: Compile and execute Windows VU1 AOT DLLs at O0 and O3
        shell: pwsh
        run: |
          $env:PATH = (Join-Path $env:RUNNER_TEMP 'llvm-22/bin') + ';' + $env:PATH
          python tests/smoke/test_vu1_aot_runtime.py build-clang/ee_vu1_aot_fixture.exe build-clang/vu1_recomp.exe tools/build_vu1_aot.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify clang++ runner stack reserve and actual startup
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build-clang/ee_game_runner.exe').Path
          $headers = (& dumpbin /headers $exe | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw 'dumpbin could not read the clang++ runner PE headers'
          }
          if ($headers -notmatch '(?im)^\s*0*800000\s+size of stack reserve') {
            throw 'clang++ runner PE stack reserve is not 8 MiB'
          }
          & $exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "clang++ runner could not enter main(): exit $LASTEXITCODE"
          }

  # Preserve the existing required check name while building both
  # toolchains in separate parallel workers. Run even if one failed.
  native-webgpu-windows:
    if: ${{ always() }}
    needs: [native-webgpu-windows-msvc, native-webgpu-windows-clang]
    runs-on: ubuntu-latest
    steps:
      - name: Require MSVC and pinned Clang native builds
        shell: bash
        run: |
          test "${{ needs.native-webgpu-windows-msvc.result }}" = success
          test "${{ needs.native-webgpu-windows-clang.result }}" = success
