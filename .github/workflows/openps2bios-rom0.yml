name: OpenPS2BIOS ROM0 execution

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  diagnose-v06:
    name: OpenPS2BIOS v0.6 firmware regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up CMake 4.5.1
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2
        with:
          cmake-version: '4.5.1'


      - name: Configure ROM0 runner
        run: cmake -S . -B build-rom0 -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build ROM0 runner and focused regressions
        run: |
          cmake --build build-rom0 --parallel 2 --target \
            iop_rom0_runner iop_rom0_sif_integration iop_cpu_test iop_rom0_boot_test iop_hw_test iop_timer5_exception_test iop_dma_icr_test iop_dma_global_enable_test iop_dma_sif_channels_test iop_sif_handoff_test
          ctest --test-dir build-rom0 --output-on-failure \
            -R '^(iop_cpu|iop_rom0_boot|iop_rom0_runner|iop_hw|iop_timer5_exception|iop_dma_icr|iop_dma_global_enable|iop_dma_sif_channels|iop_sif_handoff)$'

      - name: Build native EE runner for authentic firmware rendezvous
        run: cmake --build build-rom0 --parallel 2 --target ee_recomp ee_game_runner ee_rom0_fetch_probe ee_ram_tlb_test ee_iop_rom0_diagnostic

      - name: Install LLVM Python binding for synthetic EE translation
        run: |
          python3 -m venv .venv-rom0
          .venv-rom0/bin/python -m pip install llvmlite

      - name: Verify latest-release bootstrap and cache logic offline
        run: python3 tests/tools/test_ensure_openps2bios.py

      - name: Download official OpenPS2BIOS v0.6 ROM0
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/TamaribaEmu/OpenPS2BIOS/releases/assets/715134569"
          if ! curl --fail --location --retry 3 --retry-all-errors \
              --header 'Accept: application/octet-stream' \
              --output OpenPS2BIOS-0.6.bin "$url"; then
            curl --fail --location --retry 3 --retry-all-errors \
              --output OpenPS2BIOS-0.6.bin \
              "https://github.com/TamaribaEmu/OpenPS2BIOS/releases/download/v0.6/OpenPS2BIOS-0.6.bin"
          fi
          test "$(wc -c < OpenPS2BIOS-0.6.bin)" -eq 4194304
          printf '%s  %s\n' \
            '3702baa508ff40498fab4a95429a2ae1f903d11f5bbcdd4e1a87dbe9f5d21a84' \
            'OpenPS2BIOS-0.6.bin' | sha256sum --check

      - name: Validate strict EE ROM0 fetch and synthetic BEV1 handlers
        run: |
          set -euo pipefail
          ./build-rom0/ee_rom0_fetch_probe OpenPS2BIOS-0.6.bin | tee ee-rom0-fetch.log
          ctest --test-dir build-rom0 --output-on-failure -R '^ee_ram_tlb$'

      - name: Diagnose synchronized EE and IOP reset (v0.6)
        run: |
          set -euo pipefail
          ./build-rom0/ee_iop_rom0_diagnostic OpenPS2BIOS-0.6.bin 2000000 | tee dual-rom0-v06.log
          grep -q '^Dual ROM0 stop:' dual-rom0-v06.log
          grep -q '^Dual ROM0 clocks:' dual-rom0-v06.log
          grep -q '^Dual ROM0 fetch:' dual-rom0-v06.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          log = Path("dual-rom0-v06.log").read_text()
          stop = re.search(r"^Dual ROM0 stop: .*ee_retired=(\d+)", log, re.M)
          serial = re.search(r"^Dual ROM0 serial: bytes=(\d+)$", log, re.M)
          assert stop and int(stop[1]) > 696758, log
          assert "Dual ROM0 syscall: pc=000822c0 vector=80000180 retired=696458 status=70030c03 cause=00000020 epc=000822c0 v1=0000000000000006" in log, log
          assert serial and int(serial[1]) > 0, log
          assert re.search(r"^Dual ROM0 serial data: offset=0 hex=5b", log, re.M), log
          assert "Dual ROM0 GS reset: count=1 upper=1 siglblid=0000000000000000" in log, log
          assert "Dual ROM0 EELOAD backing: entry=00000000 call=0c020840 main=28880002 exec=00003021 syscall=0000000c marker=0c0208ae path=726f6d303a4f534453595300" in log, log
          assert re.search(r"^Dual ROM0 I-cache: resident=[1-9][0-9]*$", log, re.M), log
          PY

      - name: Execute guest IOP reset vector and capture stop
        run: |
          set -uo pipefail
          set +e
          ./build-rom0/iop_rom0_runner OpenPS2BIOS-0.6.bin \
            --instructions=10000000 --trace-tail=64 \
            --report=rom0-report.json >rom0-trace.log 2>&1
          status=$?
          set -e
          echo "ROM0 runner exit status: $status"
          cat rom0-trace.log
          test "$status" -eq 3 -o "$status" -eq 4
          python3 - <<'PY'
          import json
          with open("rom0-report.json", encoding="utf-8") as file:
              report = json.load(file)
          assert report["rom0_bytes"] == 4194304
          assert report["reset_pc"] == 0xBFC00000
          assert report["romdir_has_iopboot"]
          # This workflow is pinned to OpenPS2BIOS v0.6 and runs with
          # no EE connected. It must reach guest-initialized SIF/CMD
          # flags and the service mailbox without a guest MMIO fault.
          assert report["stop"] == "BUDGET_EXHAUSTED", report
          assert report["executed"] == 10000000, report
          assert report["memory_fault"] is None, report
          assert report["disc_mailbox_magic"] == 0x4F424344, report
          assert (report["sif_iop_smflag"] & 0x30000) == 0x30000, report
          assert report["sif_iop_subaddr"] != 0, report
          print("Guest SIF flags (IOP-originated): 0x%08X" % report["sif_iop_smflag"])
          print("Guest disc-service mailbox: 0x%08X" % report["disc_mailbox_magic"])
          print("Observed stop:", report["stop"])
          print("Guest PC: 0x%08X" % report["pc"])
          print("Guest opcode: 0x%08X" % report["opcode"])
          print("Guest memory fault:", report["memory_fault"])
          print("Executed instructions:", report["executed"])
          PY

      - name: Validate official firmware SIFCMD RPC_BIND and RPC_CALL through SIF DMA
        run: |
          set -euo pipefail
          ./build-rom0/iop_rom0_sif_integration OpenPS2BIOS-0.6.bin rom0-sif-integration.json > rom0-sif-integration.log 2>&1 || {
            cat rom0-sif-integration.log
            exit 1
          }
          cat rom0-sif-integration.log
          python3 - <<'PY'
          import json
          with open("rom0-sif-integration.json", encoding="utf-8") as file:
              report = json.load(file)
          assert report["format"] == "openps2bios-authentic-sif1-v5"
          assert report["rom0_bytes"] == 4194304
          assert report["reset_pc"] == 0xBFC00000
          assert report["boot_instructions"] == 10000000
          assert report["boot_stop"] == "BUDGET_EXHAUSTED"
          assert report["smflag_published"] & 0x30000 == 0x30000
          assert report["smflag_after_ack"] & 0x30000 == 0
          assert 0 < report["firmware_receive_buffer"] < 0x200000
          assert report["direction"] == "SIF1"
          assert report["ee_channel"] == 6 and report["iop_channel"] == 10
          assert report["requested_bytes"] == report["transferred_bytes"] == 16
          # This is all three genuine DMA10 packets: original probe
          # (16 B), INIT_CMD address (32 B), RPC INIT_CMD (16 B).
          assert report["sifcmd_sif1_transferred_bytes"] == 64
          assert report["rpc_bind_total_sif1_bytes"] == 112
          assert report["total_sif1_transferred_bytes"] == 176
          assert report["source_checksum"] == report["destination_checksum"]
          assert report["iop_chcr_before"] & 0x01000000
          assert report["iop_chcr_after"] & 0x01000000 == 0
          assert report["ee_chcr_after"] & 0x100 == 0
          assert report["ee_dstat"] & (1 << 6)
          assert report["iop_dicr2"] & (1 << 27)
          assert report["iop_istat"] & (1 << 3)
          assert report["continuation_stop"] == "BUDGET_EXHAUSTED"
          assert report["sifcmd_second_received"] == report["sifcmd_first_received"] + 1
          assert report["sifcmd_last_command"] == 0x80000002
          assert report["sifcmd_result"] == 0
          assert report["sifcmd_ee_buffer"] == 0x00180000
          assert report["sifcmd_rpc_requested"] == 1
          assert report["sifcmd_rpc_announced"] == 1
          assert report["sifcmd_sif0_reply_bytes"] == 32
          assert report["rpc_bind_total_sif0_bytes"] == 80
          assert report["total_sif0_transferred_bytes"] == 144
          assert report["rpc_bind_received"] == report["sifcmd_second_received"] + 1
          assert report["rpc_bind_command"] == 0x80000009
          assert report["rpc_bind_result"] == 0
          assert report["rpc_bind_sid"] == 0x80000006
          assert report["rpc_bind_server"] == 0x0004BB00
          assert report["rpc_bind_reply_bytes"] == 48
          assert report["rpc_bind_iop_dma9_chcr"] & 0x01000000 == 0
          assert report["rpc_bind_ee_dma5_chcr"] & 0x100 == 0
          assert report["rpc_call_dma_id"] == 1
          assert report["rpc_call_received"] == report["rpc_bind_received"] + 1
          assert report["rpc_call_command"] == 0x8000000A
          assert report["rpc_call_result"] == 0
          assert report["rpc_call_fno"] == 0xFF
          assert report["rpc_call_version_word"] == 0x30303133
          assert report["rpc_call_result_bytes"] == 16
          assert report["rpc_call_end_bytes"] == 48
          assert report["rpc_call_iop_dma9_chcr"] & 0x01000000 == 0
          assert report["rpc_call_ee_dma5_chcr"] & 0x100 == 0
          assert report["sifcmd_ee_dma5_chcr"] & 0x100 == 0
          print("Official ROM0 DMA6->DMA10 bytes verified:", report["transferred_bytes"])
          print("Genuine firmware SIFCMD and SIF0 reply bytes:", report["sifcmd_sif0_reply_bytes"])
          print("Real LOADFILE RPC_BIND server:", hex(report["rpc_bind_server"]))
          print("Guest RPC_END bytes:", report["rpc_bind_reply_bytes"])
          print("LOADFILE GET_VERSION word:", hex(report["rpc_call_version_word"]))
          print("Real RPC_CALL result and RPC_END bytes:", report["rpc_call_result_bytes"], report["rpc_call_end_bytes"])
          print("Guest-published destination: 0x%08X" % report["firmware_receive_buffer"])
          PY

      - name: Verify native EE runner observes authentic ROM0 SMFLAG
        run: |
          set -euo pipefail
          .venv-rom0/bin/python tests/tools/test_rom0_ee_poll.py \
            --rom0 OpenPS2BIOS-0.6.bin \
            --build-dir build-rom0 \
            --work-dir build-rom0/ee-rom0-handshake \
            --report rom0-ee-smflag.json \
            --log rom0-ee-smflag.log || {
              cat rom0-ee-smflag.log
              exit 1
            }
          tail -n 16 rom0-ee-smflag.log
          tail -n 24 rom0-ee-sifsetdma.log

      - name: Verify genuine ROM0 SIF0 reply invokes EE DMA5 guest handler
        run: |
          set -euo pipefail
          .venv-rom0/bin/python tests/tools/test_rom0_dma5_callback.py \
            --rom0 OpenPS2BIOS-0.6.bin \
            --build-dir build-rom0 \
            --work-dir build-rom0/ee-rom0-dma5-callback || {
              cat build-rom0/ee-rom0-dma5-callback/ee-dma5-callback.log || true
              exit 1
            }

      # The release image is downloaded and SHA-256 checked above. Save
      # only successful verified builds for reproducing real guest ROM0
      # execution outside the CI runner, without storing firmware in git.
      - name: Preserve verified official ROM0 for native boot diagnostics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openps2bios-v06-verified-rom0
          path: OpenPS2BIOS-0.6.bin
          if-no-files-found: error
          retention-days: 7

      - name: Preserve actual guest execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openps2bios-v06-rom0-execution
          path: |
            ee-rom0-fetch.log
            dual-rom0-v06.log
            rom0-report.json
            rom0-ee-smflag.json
            rom0-ee-smflag.log
            rom0-ee-sifsetdma.json
            rom0-ee-sifsetdma.log
            build-rom0/ee-rom0-dma5-callback/ee-dma5-callback.json
            build-rom0/ee-rom0-dma5-callback/ee-dma5-callback.log
            rom0-trace.log
            rom0-sif-integration.json
            rom0-sif-integration.log
          if-no-files-found: ignore
          retention-days: 7

  diagnose-v07:
    name: OpenPS2BIOS v0.7 firmware diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up CMake 4.5.1
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2
        with:
          cmake-version: '4.5.1'

      - name: Build strict EE and IOP firmware diagnostics
        run: |
          cmake -S . -B build-rom0 -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-rom0 --parallel 2 --target ee_rom0_fetch_probe ee_ram_tlb_test iop_rom0_runner ee_iop_rom0_diagnostic
          ctest --test-dir build-rom0 --output-on-failure -R '^ee_ram_tlb$'

      - name: Download and verify official OpenPS2BIOS v0.7 ROM0
        run: |
          set -euo pipefail
          base="https://github.com/TamaribaEmu/OpenPS2BIOS/releases/download/v0.7"
          image="OpenPS2BIOS-0.7.bin"
          curl --fail --location --retry 3 --retry-all-errors --output "$image" "$base/$image"
          curl --fail --location --retry 3 --retry-all-errors --output "$image.sha256" "$base/$image.sha256"
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from ensure_openps2bios import ROM0_SIZE, parse_sha256, sha256_file
          image = Path("OpenPS2BIOS-0.7.bin")
          expected = parse_sha256(Path(str(image) + ".sha256").read_bytes(), image.name)
          actual = sha256_file(image)
          pinned = "062e563879f6bf12504cef125a4edeea2d5528f0e3c2cf49928942124eb6f150"
          if image.stat().st_size != ROM0_SIZE or expected != actual or actual != pinned:
              raise SystemExit("OpenPS2BIOS v0.7 size or SHA-256 mismatch")
          print("Verified OpenPS2BIOS v0.7 SHA-256:", actual)
          Path("rom0-v07-verified.sha256").write_text(f"{actual}  {image.name}\n")
          PY

      - name: Diagnose synchronized EE and IOP reset (v0.7)
        run: |
          set -euo pipefail
          ./build-rom0/ee_iop_rom0_diagnostic OpenPS2BIOS-0.7.bin 2000000 | tee dual-rom0-v07.log
          grep -q '^Dual ROM0 stop:' dual-rom0-v07.log
          grep -q '^Dual ROM0 clocks:' dual-rom0-v07.log
          grep -q '^Dual ROM0 fetch:' dual-rom0-v07.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          log = Path("dual-rom0-v07.log").read_text()
          stop = re.search(r"^Dual ROM0 stop: .*ee_retired=(\d+)", log, re.M)
          serial = re.search(r"^Dual ROM0 serial: bytes=(\d+)$", log, re.M)
          assert stop and int(stop[1]) > 696950, log
          assert "Dual ROM0 syscall: pc=000822c0 vector=80000180 retired=696650 status=70030c03 cause=00000020 epc=000822c0 v1=0000000000000006" in log, log
          assert serial and int(serial[1]) > 0, log
          assert re.search(r"^Dual ROM0 serial data: offset=0 hex=5b", log, re.M), log
          assert "Dual ROM0 GS reset: count=1 upper=1 siglblid=0000000000000000" in log, log
          assert "Dual ROM0 EELOAD backing: entry=00000000 call=0c020840 main=28880002 exec=00003021 syscall=0000000c marker=0c0208ae path=726f6d303a4f534453595300" in log, log
          assert re.search(r"^Dual ROM0 I-cache: resident=[1-9][0-9]*$", log, re.M), log
          PY

      - name: Explore authentic v0.7 EE reset execution
        run: |
          set -euo pipefail
          status=0
          ./build-rom0/ee_rom0_fetch_probe OpenPS2BIOS-0.7.bin --explore >ee-rom0-v07.log 2>&1 || status=$?
          cat ee-rom0-v07.log
          echo "EE v0.7 diagnostic exit: $status"
          test "$status" -eq 3 -o "$status" -eq 4
          grep -q '^EE exploration stop:' ee-rom0-v07.log
          grep -Fx 'EE exploration first TLBWI: retired=653849 pc=a001976c index=0 mask=00000000 hi=70000000 lo0=80000007 lo1=00000007' ee-rom0-v07.log
          grep -Fx 'EE exploration initial TLB writes: retired=654101 count=13' ee-rom0-v07.log
          grep -Fx 'EE exploration VIF resets: vif0=1 vif1=1' ee-rom0-v07.log
          grep -Fx 'EE exploration VIF FIFO: vif0=1 vif1=1' ee-rom0-v07.log
          grep -Fx 'EE exploration INTC first write: retired=671789 pc=a00166ec read=00000000 write=00000002 mask=00000002 status=00000000' ee-rom0-v07.log
          grep -Fx 'EE exploration Timer3 write: retired=672737 pc=a0014cc8 address=10001810 value=00000c00 mode=00000000 count=00000000' ee-rom0-v07.log
          grep -Fx 'EE exploration Timer3 write: retired=672739 pc=a0014cd0 address=10001800 value=00000000 mode=00000000 count=00000000' ee-rom0-v07.log
          grep -Fx 'EE exploration Timer3 write: retired=672744 pc=a0014ce4 address=10001820 value=0000ffff mode=00000000 count=00000000' ee-rom0-v07.log
          grep -Fx 'EE exploration Timer3 write: retired=672746 pc=a0014cec address=10001810 value=00000083 mode=00000083 count=00000000' ee-rom0-v07.log
          grep -Fx 'EE exploration D_CTRL: retired=690997 pc=a00141ac read=00000000 write=00000001 control=00000001' ee-rom0-v07.log
          grep -Fx 'EE exploration MSFLAG: retired=690998 pc=a00141b0 write=00010000 flags=00010000' ee-rom0-v07.log
          grep -Fx 'EE exploration GS reset: retired=691013 pc=a0016270 count=1 siglblid=0000000000000000' ee-rom0-v07.log
          grep -Fx 'EE exploration GS CSR upper: retired=691014 pc=a0016274 count=1' ee-rom0-v07.log
          grep -Fx 'EE exploration ROM bounds: retired=691104 pc=a00102c4 result=0000000000000001' ee-rom0-v07.log
          grep -E '^EE exploration ROM word: retired=691172 pc=a00102f0 value=[0-9a-f]{8} matched=1$' ee-rom0-v07.log
          grep -Fx 'EE exploration DXWBIN: retired=695509 pc=a0019104 lines=128' ee-rom0-v07.log
          grep -Fx 'EE exploration IXIN: retired=696409 pc=a0019130 lines=256' ee-rom0-v07.log
          grep -Fx 'EE exploration interrupt boundary: retired=696585 pc=a0014a4c current=70000000 requested=70030c01 cause=00000000 intc_mask=00001002 intc_stat=00000000' ee-rom0-v07.log
          echo "::notice::EE v0.7 diagnostic captured; full boot is not asserted."

      - name: Explore authentic v0.7 IOP reset execution
        if: success() || failure()
        run: |
          set -euo pipefail
          test -f rom0-v07-verified.sha256
          sha256sum --check rom0-v07-verified.sha256
          status=0
          ./build-rom0/iop_rom0_runner OpenPS2BIOS-0.7.bin \
            --instructions=10000000 --trace-tail=64 \
            --report=rom0-v07-report.json >rom0-v07-trace.log 2>&1 || status=$?
          cat rom0-v07-trace.log
          echo "IOP v0.7 diagnostic exit: $status"
          test "$status" -eq 3 -o "$status" -eq 4
          python3 - <<'PY'
          import json
          with open("rom0-v07-report.json", encoding="utf-8") as file:
              report = json.load(file)
          assert report["rom0_bytes"] == 4194304, report
          assert report["reset_pc"] == 0xBFC00000, report
          assert report["romdir_has_iopboot"], report
          assert 0 < report["executed"] <= 10000000, report
          print("IOP v0.7 observed stop:", report["stop"])
          print("IOP v0.7 executed:", report["executed"])
          print("IOP v0.7 PC: 0x%08X" % report["pc"])
          print("IOP v0.7 memory fault:", report["memory_fault"])
          PY
          echo "::notice::IOP v0.7 diagnostic captured; full boot is not asserted."

      - name: Preserve v0.7 execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openps2bios-v07-rom0-execution
          path: |
            rom0-v07-verified.sha256
            ee-rom0-v07.log
            dual-rom0-v07.log
            rom0-v07-report.json
            rom0-v07-trace.log
          if-no-files-found: warn
          retention-days: 7
